<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Zombie Survival</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;background:#000;font-family:Arial,sans-serif;color:#fff;user-select:none}
canvas{display:block}
.h{position:fixed;pointer-events:none;text-shadow:0 0 4px #000,0 0 6px #000}
#tl{left:16px;top:12px;font-size:20px;line-height:1.5}#hearts{font-size:24px}
#ammo{right:20px;bottom:16px;font-size:34px}
#cross{left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px}
#banner{left:0;right:0;top:20%;text-align:center;font-size:56px;font-weight:bold;opacity:0;transition:opacity .4s}
#boss{left:50%;top:12px;transform:translateX(-50%);text-align:center;display:none;width:380px;font-weight:bold}
#bbar{height:16px;background:#400;border:2px solid #000}#bfill{height:100%;background:#b5179e;width:100%}
#dmg{inset:0;background:red;opacity:0;transition:opacity .25s}
#hint{left:0;right:0;bottom:90px;text-align:center;font-size:22px;color:#ffd23f;display:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.6}
h1{font-size:64px;margin:0 0 10px;color:#d62828;letter-spacing:4px}
button{font-size:24px;padding:12px 32px;margin-top:20px;cursor:pointer;background:#b01e1e;color:#fff;border:0;border-radius:6px}
#mm{position:fixed;right:10px;top:10px;width:190px;height:190px;border:2px solid #000;background:#000;z-index:6;opacity:.92;cursor:pointer}#mm.big{width:min(75vh,75vw);height:min(75vh,75vw)}@media (pointer:coarse){#mm{width:130px;height:130px}}
#chat{left:16px;bottom:16px;width:min(440px,60vw);font-size:15px;line-height:1.35;z-index:3}#ci{position:fixed;left:16px;bottom:12px;width:min(420px,70vw);padding:8px 10px;font-size:16px;border:2px solid #000;border-radius:6px;background:rgba(0,0,0,.8);color:#fff;display:none;z-index:7}@media (pointer:coarse){#chat{bottom:170px;width:34vw;font-size:13px}}
#gear{position:fixed;right:210px;top:10px;width:44px;height:44px;border-radius:50%;border:2px solid #000;background:rgba(0,0,0,.65);color:#fff;font-size:24px;line-height:1;padding:0;margin:0;cursor:pointer;z-index:8}#st{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9}#st label{display:block;margin:12px 0;font-size:16px}#st input[type=range]{width:100%}@media (pointer:coarse){#gear{right:150px}}
#help{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:12;overflow:auto;padding:3vmin 4vmin;box-sizing:border-box;font-size:clamp(13px,2.2vmin,17px);line-height:1.5;text-align:left;color:#eee}
#help h2{margin:0 0 6px;color:#ffd23f}#help h3{margin:10px 0 2px;color:#7dd0ff}#help .g{columns:2 340px;column-gap:30px}#help b{color:#ffd23f}#help p{margin:2px 0;break-inside:avoid}
#sb{left:50%;bottom:8px;transform:translateX(-50%);width:min(240px,40vw);height:9px;border:2px solid #000;background:#222;display:none;z-index:3}#sbf{height:100%;width:100%;background:#4caf50}
#ov{overflow:auto;-webkit-overflow-scrolling:touch}#ov>div{max-width:96vw}
html,body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;overscroll-behavior:none}
body{height:100dvh}
#tl{font-size:clamp(13px,2.3vmin,20px)}#ammo{font-size:clamp(18px,4vmin,34px)}#banner{font-size:clamp(22px,7vmin,56px);padding:0 10px;box-sizing:border-box}#boss{width:min(380px,56vw)}
h1{font-size:clamp(28px,8vmin,64px)}button{font-size:clamp(15px,3vmin,24px);padding:clamp(8px,1.8vmin,12px) clamp(14px,3vmin,32px)}
#mm{width:clamp(110px,24vmin,190px);height:clamp(110px,24vmin,190px)}#mm.big{width:min(75vh,75vw);height:min(75vh,75vw)}
#gear{right:calc(clamp(110px,24vmin,190px) + 22px)}
#hint{bottom:auto;top:auto;left:50%;right:auto;transform:translateX(-50%);bottom:26px;font-size:13px;color:#ffd23f;opacity:.75}
@media (max-height:430px){#tl{line-height:1.2}#hearts{font-size:18px}h1{margin:0}}
</style></head><body>
<div class="h" id="tl"><div id="hearts"></div><div id="hits" style="font-size:16px"></div><div id="kits"></div><div id="lvl"></div><div id="kill"></div><div id="sc" style="font-size:14px;color:#ffd23f"></div><div id="rk" style="font-size:14px;color:#9fd8ff"></div></div>
<div class="h" id="ammo"></div><div class="h" id="cross">+</div><div class="h" id="banner"></div>
<div class="h" id="boss"><div id="bname"></div><div id="bbar"><div id="bfill"></div></div></div>
<div class="h" id="dmg"></div><div class="h" id="hint">TAB — справка и управление</div>
<canvas id="mm"></canvas>
<button id="gear" title="Настройки">⚙</button>
<div id="st"></div>
<div class="h" id="tbar" style="top:12px;left:50%;transform:translateX(-50%);display:none;gap:10px;pointer-events:auto;z-index:8"><button onmousedown="event.stopPropagation()" onclick="exitTraining()" style="font-size:14px;padding:6px 12px;margin:0">⬅ В меню</button><button onmousedown="event.stopPropagation()" onclick="resetTrain()" style="font-size:14px;padding:6px 12px;margin:0;background:#444">↺ Сброс счёта</button></div>
<div class="h" id="chat"></div>
<input id="ci" maxlength="120" placeholder="Сообщение (Enter — отправить, Esc — отмена)" autocomplete="off">
<div id="help"></div>
<div class="h" id="sb"><div id="sbf"></div></div>
<div id="ov"></div>
